<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNTRY LEATHER by TOTAL FEST</title>
    <meta name="description" content="Catálogo de chamarras de piel premium">
    <meta name="theme-color" content="#0a1929">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Country Leather">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --fondo: #0a1929;
            --tarjeta: #132f4c;
            --azul: #1976d2;
            --azul-claro: #64b5f6;
            --morado: #8e24aa;
            --verde: #4caf50;
            --blanco: #ffffff;
            --gris: #b0bec5;
            --dorado: #d4a843;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--fondo);
            color: var(--blanco);
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--tarjeta), #1a1a2e);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--dorado);
        }

        .header h1 {
            font-size: 24px;
            color: var(--dorado);
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .header .sub {
            color: var(--gris);
            font-size: 13px;
        }

        /* FILTROS */
        .filtros {
            display: flex;
            gap: 8px;
            padding: 15px;
            overflow-x: auto;
            background: var(--tarjeta);
        }

        .filtro-btn {
            padding: 8px 16px;
            border: 1px solid var(--azul);
            background: transparent;
            color: var(--azul-claro);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filtro-btn.activo {
            background: var(--azul);
            color: var(--blanco);
        }

        /* GRID DE TARJETAS */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }

        .tarjeta {
            background: var(--tarjeta);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tarjeta-img {
            width: 100%;
            height: 180px;
            background: #1a2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .tarjeta-info {
            padding: 12px;
        }

        .tarjeta-nombre {
            font-size: 14px;
            font-weight: 700;
            color: var(--dorado);
            margin-bottom: 4px;
        }

        .tarjeta-cat {
            font-size: 11px;
            color: var(--gris);
            margin-bottom: 6px;
        }

        .tarjeta-tallas {
            font-size: 10px;
            color: var(--azul-claro);
            margin-bottom: 8px;
        }

        .tarjeta-precio {
            font-size: 18px;
            font-weight: 800;
            color: var(--verde);
        }

        .tarjeta-precio .mayoreo {
            font-size: 11px;
            color: var(--gris);
            text-decoration: line-through;
            display: block;
        }

        /* BOTÓN WHATSAPP */
        .btn-wa {
            display: block;
            width: 100%;
            padding: 10px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            text-decoration: none;
            text-align: center;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--gris);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤠 COUNTRY LEATHER</h1>
        <p class="sub">by TOTAL FEST · Chamarras de Piel Premium</p>
    </div>

    <div class="filtros" id="filtros"></div>
    <div class="grid" id="grid"></div>

    <div class="footer">
        COUNTRY LEATHER by TOTAL FEST © 2027<br>
        📲 Pedidos por WhatsApp
    </div>

    <script>
        // ============================================
        // 🧠 ARRAY MAESTRO DE DATOS
        // ============================================
        const WHATSAPP = '527207130330';

        const CATALOGO = [
            {
                modelo: 'PILOTO',
                categoria: 'Caballeros',
                tallas: 'CH · M · G · XG · 2XL',
                mayoreo: 1900,
                publico: 2700,
                emoji: '🧥'
            },
            {
                modelo: 'JENIFER',
                categoria: 'Damas',
                tallas: 'CH · M · G · XG · 2XL · 3XL',
                mayoreo: 1600,
                publico: 2300,
                emoji: '🧥'
            },
            {
                modelo: 'AVIADOR JR',
                categoria: 'Niños',
                tallas: '08 · 10 · 12 · 14 · 16',
                mayoreo: 1300,
                publico: 1900,
                emoji: '👦'
            },
            {
                modelo: 'ZOE',
                categoria: 'Niñas',
                tallas: '08 · 10 · 12 · 14 · 16',
                mayoreo: 1300,
                publico: 1900,
                emoji: '👧'
            }
        ];

        // ============================================
        // 🎨 RENDERIZAR FILTROS
        // ============================================
        const categorias = ['Todos', ...new Set(CATALOGO.map(p => p.categoria))];

        document.getElementById('filtros').innerHTML = categorias.map((cat, i) =>
            `<button class="filtro-btn ${i === 0 ? 'activo' : ''}" onclick="filtrar('${cat}', this)">${cat}</button>`
        ).join('');

        // ============================================
        // 🎨 RENDERIZAR TARJETAS
        // ============================================
        function renderizar(lista) {
            document.getElementById('grid').innerHTML = lista.map(p => `
                <div class="tarjeta">
                    <div class="tarjeta-img">${p.emoji}</div>
                    <div class="tarjeta-info">
                        <div class="tarjeta-nombre">${p.modelo}</div>
                        <div class="tarjeta-cat">${p.categoria}</div>
                        <div class="tarjeta-tallas">📏 ${p.tallas}</div>
                        <div class="tarjeta-precio">
                            $${p.publico.toLocaleString()} MXN
                            <span class="mayoreo">Mayoreo: $${p.mayoreo.toLocaleString()}</span>
                        </div>
                        <a class="btn-wa" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola! Me interesa la chamarra ' + p.modelo + ' ($' + p.publico + '). ¿Tienen disponible?')}" target="_blank">
                            📲 Pedir por WhatsApp
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // 🔍 FILTRAR
        // ============================================
        function filtrar(cat, btn) {
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            const lista = cat === 'Todos' ? CATALOGO : CATALOGO.filter(p => p.categoria === cat);
            renderizar(lista);
        }

        // ============================================
        // 🚀 INICIO
        // ============================================
        renderizar(CATALOGO);
    </script>
</body>
</html>
