<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNTRY LEATHER by TOTAL FEST</title>
    <meta name="description" content="Catálogo de chamarras de piel premium">
    <meta name="theme-color" content="#1a1410">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Country Leather">
    <link rel="manifest" href="manifest.json">

    <style>
        /* ============================================ */
        /* 🎨 PALETA RANCHERA PREMIUM                   */
        /* ============================================ */
        :root {
            --fondo: #1a1410;
            --tarjeta: #2d1f15;
            --tarjeta-hover: #3a2819;
            --dorado: #d4a843;
            --dorado-claro: #e8c170;
            --terracota: #a0522d;
            --crema: #f5e6d3;
            --crema-suave: #d4c4a8;
            --azul-tf: #4a6fa5;
            --verde-wa: #25d366;
            --verde-wa-hover: #1da851;
            --borde: rgba(212, 168, 67, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--crema);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* ============================================ */
        /* 🪵 FONDO MADERA BASE (TODOS)                 */
        /* ============================================ */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: 
                linear-gradient(135deg, 
                    #2a1d13 0%, 
                    #1a1410 25%, 
                    #241812 50%, 
                    #1a1410 75%, 
                    #2a1d13 100%);
            transition: background 0.5s ease;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background:
                repeating-linear-gradient(88deg, transparent 0px, transparent 18px, rgba(90, 60, 30, 0.15) 18px, rgba(90, 60, 30, 0.15) 19px, transparent 19px, transparent 42px),
                repeating-linear-gradient(92deg, transparent 0px, transparent 35px, rgba(60, 40, 20, 0.2) 35px, rgba(60, 40, 20, 0.2) 37px, transparent 37px, transparent 80px),
                repeating-linear-gradient(87deg, transparent 0px, transparent 60px, rgba(120, 80, 40, 0.08) 60px, rgba(120, 80, 40, 0.08) 62px, transparent 62px, transparent 120px),
                radial-gradient(ellipse 120px 80px at 20% 30%, rgba(40, 25, 15, 0.4) 0%, transparent 70%),
                radial-gradient(ellipse 150px 100px at 75% 65%, rgba(40, 25, 15, 0.35) 0%, transparent 70%),
                radial-gradient(ellipse 100px 70px at 50% 85%, rgba(50, 30, 18, 0.3) 0%, transparent 70%),
                radial-gradient(ellipse 80px 60px at 85% 15%, rgba(50, 30, 18, 0.25) 0%, transparent 70%),
                radial-gradient(ellipse at 30% 20%, rgba(212, 168, 67, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 168, 67, 0.03) 0%, transparent 50%);
            transition: opacity 0.5s ease;
        }

        /* ============================================ */
        /* 🎨 FONDOS NOTORIOS POR CATEGORÍA             */
        /* ============================================ */
        
        /* CABALLEROS: Madera oscura + tinte terracota (rojizo) */
        body.cat-caballeros::before {
            background: 
                linear-gradient(135deg, 
                    #3a2015 0%, 
                    #2a1510 25%, 
                    #351a12 50%, 
                    #2a1510 75%, 
                    #3a2015 100%);
        }
        
        body.cat-caballeros::after {
            background:
                repeating-linear-gradient(88deg, transparent 0px, transparent 18px, rgba(160, 82, 45, 0.25) 18px, rgba(160, 82, 45, 0.25) 19px, transparent 19px, transparent 42px),
                repeating-linear-gradient(92deg, transparent 0px, transparent 35px, rgba(120, 60, 30, 0.35) 35px, rgba(120, 60, 30, 0.35) 37px, transparent 37px, transparent 80px),
                repeating-linear-gradient(87deg, transparent 0px, transparent 60px, rgba(140, 70, 35, 0.15) 60px, rgba(140, 70, 35, 0.15) 62px, transparent 62px, transparent 120px),
                radial-gradient(ellipse 150px 100px at 20% 30%, rgba(160, 82, 45, 0.4) 0%, transparent 70%),
                radial-gradient(ellipse 180px 120px at 75% 65%, rgba(140, 70, 35, 0.35) 0%, transparent 70%),
                radial-gradient(ellipse 120px 80px at 50% 85%, rgba(120, 60, 30, 0.3) 0%, transparent 70%),
                radial-gradient(ellipse at 30% 20%, rgba(212, 168, 67, 0.08) 0%, transparent 50%);
        }

        /* DAMAS: Madera clara + tinte dorado rosado */
        body.cat-damas::before {
            background: 
                linear-gradient(135deg, 
                    #2d2018 0%, 
                    #1f1612 25%, 
                    #281c15 50%, 
                    #1f1612 75%, 
                    #2d2018 100%);
        }
        
        body.cat-damas::after {
            background:
                repeating-linear-gradient(88deg, transparent 0px, transparent 18px, rgba(212, 168, 67, 0.18) 18px, rgba(212, 168, 67, 0.18) 19px, transparent 19px, transparent 42px),
                repeating-linear-gradient(92deg, transparent 0px, transparent 35px, rgba(180, 140, 80, 0.22) 35px, rgba(180, 140, 80, 0.22) 37px, transparent 37px, transparent 80px),
                repeating-linear-gradient(87deg, transparent 0px, transparent 60px, rgba(200, 160, 100, 0.12) 60px, rgba(200, 160, 100, 0.12) 62px, transparent 62px, transparent 120px),
                radial-gradient(ellipse 140px 90px at 20% 30%, rgba(212, 168, 67, 0.25) 0%, transparent 70%),
                radial-gradient(ellipse 160px 110px at 75% 65%, rgba(200, 150, 90, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse 110px 75px at 50% 85%, rgba(190, 140, 85, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse at 30% 20%, rgba(232, 193, 112, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 168, 67, 0.1) 0%, transparent 50%);
        }

        /* NIÑOS: Madera media + tinte ámbar (anaranjado) */
        body.cat-ninos::before {
            background: 
                linear-gradient(135deg, 
                    #2a1e14 0%, 
                    #1d1510 25%, 
                    #251a13 50%, 
                    #1d1510 75%, 
                    #2a1e14 100%);
        }
        
        body.cat-ninos::after {
            background:
                repeating-linear-gradient(88deg, transparent 0px, transparent 18px, rgba(200, 120, 60, 0.2) 18px, rgba(200, 120, 60, 0.2) 19px, transparent 19px, transparent 42px),
                repeating-linear-gradient(92deg, transparent 0px, transparent 35px, rgba(180, 100, 50, 0.28) 35px, rgba(180, 100, 50, 0.28) 37px, transparent 37px, transparent 80px),
                repeating-linear-gradient(87deg, transparent 0px, transparent 60px, rgba(190, 110, 55, 0.14) 60px, rgba(190, 110, 55, 0.14) 62px, transparent 62px, transparent 120px),
                radial-gradient(ellipse 130px 85px at 20% 30%, rgba(200, 120, 60, 0.3) 0%, transparent 70%),
                radial-gradient(ellipse 150px 100px at 75% 65%, rgba(190, 110, 55, 0.25) 0%, transparent 70%),
                radial-gradient(ellipse 100px 70px at 50% 85%, rgba(180, 100, 50, 0.22) 0%, transparent 70%),
                radial-gradient(ellipse at 30% 20%, rgba(212, 168, 67, 0.12) 0%, transparent 50%);
        }

        /* NIÑAS: Madera muy clara + tinte crema dorado */
        body.cat-ninas::before {
            background: 
                linear-gradient(135deg, 
                    #2f2419 0%, 
                    #221a14 25%, 
                    #2a1f17 50%, 
                    #221a14 75%, 
                    #2f2419 100%);
        }
        
        body.cat-ninas::after {
            background:
                repeating-linear-gradient(88deg, transparent 0px, transparent 18px, rgba(220, 180, 120, 0.15) 18px, rgba(220, 180, 120, 0.15) 19px, transparent 19px, transparent 42px),
                repeating-linear-gradient(92deg, transparent 0px, transparent 35px, rgba(200, 160, 100, 0.2) 35px, rgba(200, 160, 100, 0.2) 37px, transparent 37px, transparent 80px),
                radial-gradient(ellipse 120px 80px at 20% 30%, rgba(220, 180, 120, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse 140px 95px at 75% 65%, rgba(210, 170, 110, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 50%, rgba(232, 193, 112, 0.15) 0%, transparent 50%);
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--tarjeta), #1f1610);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--dorado);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 26px;
            color: var(--dorado);
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header .sub {
            color: var(--crema-suave);
            font-size: 13px;
            letter-spacing: 1px;
        }

        .header .linea {
            width: 60px;
            height: 2px;
            background: var(--terracota);
            margin: 10px auto;
        }

        /* FILTROS */
        .filtros {
            display: flex;
            gap: 8px;
            padding: 15px;
            overflow-x: auto;
            background: var(--tarjeta);
            border-bottom: 1px solid var(--borde);
        }

        .filtro-btn {
            padding: 8px 16px;
            border: 1px solid var(--terracota);
            background: transparent;
            color: var(--dorado-claro);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filtro-btn.activo {
            background: var(--terracota);
            color: var(--crema);
            border-color: var(--dorado);
        }

        /* GRID DE TARJETAS */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }

        .tarjeta {
            background: var(--tarjeta);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--borde);
            transition: transform 0.2s;
        }

        .tarjeta:hover {
            transform: translateY(-2px);
            background: var(--tarjeta-hover);
        }

        .tarjeta-img {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #2a1d13, #1a1410);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border-bottom: 1px solid var(--borde);
        }

        .tarjeta-info {
            padding: 12px;
        }

        .tarjeta-nombre {
            font-size: 14px;
            font-weight: 700;
            color: var(--dorado);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .tarjeta-cat {
            font-size: 11px;
            color: var(--terracota);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tarjeta-tallas {
            font-size: 10px;
            color: var(--azul-tf);
            margin-bottom: 8px;
        }

        .tarjeta-precio {
            font-size: 18px;
            font-weight: 800;
            color: var(--dorado-claro);
        }

        .tarjeta-precio .mayoreo {
            font-size: 11px;
            color: var(--crema-suave);
            text-decoration: line-through;
            display: block;
            font-weight: 400;
        }

        /* BOTÓN WHATSAPP */
        .btn-wa {
            display: block;
            width: 100%;
            padding: 10px;
            background: var(--verde-wa);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            text-decoration: none;
            text-align: center;
            transition: background 0.3s;
        }

        .btn-wa:hover {
            background: var(--verde-wa-hover);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--crema-suave);
            font-size: 12px;
            border-top: 1px solid var(--borde);
            margin-top: 20px;
        }

        .footer .marca {
            color: var(--dorado);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤠 COUNTRY LEATHER</h1>
        <div class="linea"></div>
        <p class="sub">by TOTAL FEST · Chamarras de Piel Premium</p>
    </div>

    <div class="filtros" id="filtros"></div>
    <div class="grid" id="grid"></div>

    <div class="footer">
        <span class="marca">COUNTRY LEATHER</span> by TOTAL FEST © 2027<br>
        📲 Pedidos por WhatsApp
    </div>

    <script>
        // ============================================
        // 🧠 ARRAY MAESTRO DE DATOS
        // ============================================
        const WHATSAPP = '527207130330';

        const CATALOGO = [
            {
                modelo: 'PILOTO',
                categoria: 'Caballeros',
                tallas: 'CH · M · G · XG · 2XL',
                mayoreo: 1900,
                publico: 2700,
                emoji: '🧥'
            },
            {
                modelo: 'JENIFER',
                categoria: 'Damas',
                tallas: 'CH · M · G · XG · 2XL · 3XL',
                mayoreo: 1600,
                publico: 2300,
                emoji: '🧥'
            },
            {
                modelo: 'AVIADOR JR',
                categoria: 'Niños',
                tallas: '08 · 10 · 12 · 14 · 16',
                mayoreo: 1300,
                publico: 1900,
                emoji: '👦'
            },
            {
                modelo: 'ZOE',
                categoria: 'Niñas',
                tallas: '08 · 10 · 12 · 14 · 16',
                mayoreo: 1300,
                publico: 1900,
                emoji: '👧'
            }
        ];

        // ============================================
        // 🎨 RENDERIZAR FILTROS
        // ============================================
        const categorias = ['Todos', ...new Set(CATALOGO.map(p => p.categoria))];

        document.getElementById('filtros').innerHTML = categorias.map((cat, i) =>
            `<button class="filtro-btn ${i === 0 ? 'activo' : ''}" onclick="filtrar('${cat}', this)">${cat}</button>`
        ).join('');

        // ============================================
        // 🎨 RENDERIZAR TARJETAS
        // ============================================
        function renderizar(lista) {
            document.getElementById('grid').innerHTML = lista.map(p => `
                <div class="tarjeta">
                    <div class="tarjeta-img">${p.emoji}</div>
                    <div class="tarjeta-info">
                        <div class="tarjeta-nombre">${p.modelo}</div>
                        <div class="tarjeta-cat">${p.categoria}</div>
                        <div class="tarjeta-tallas">📏 ${p.tallas}</div>
                        <div class="tarjeta-precio">
                            $${p.publico.toLocaleString()} MXN
                            <span class="mayoreo">Mayoreo: $${p.mayoreo.toLocaleString()}</span>
                        </div>
                        <a class="btn-wa" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Hola! Me interesa la chamarra ' + p.modelo + ' ($' + p.publico + '). ¿Tienen disponible?')}" target="_blank">
                            📲 Pedir por WhatsApp
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // 🔍 FILTRAR + CAMBIAR FONDO
        // ============================================
        function filtrar(cat, btn) {
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            
            // Cambiar clase del body para el fondo
            document.body.className = '';
            if (cat === 'Caballeros') document.body.classList.add('cat-caballeros');
            else if (cat === 'Damas') document.body.classList.add('cat-damas');
            else if (cat === 'Niños') document.body.classList.add('cat-ninos');
            else if (cat === 'Niñas') document.body.classList.add('cat-ninas');
            
            const lista = cat === 'Todos' ? CATALOGO : CATALOGO.filter(p => p.categoria === cat);
            renderizar(lista);
        }

        // ============================================
        // 🚀 INICIO
        // ============================================
        renderizar(CATALOGO);
    </script>
</body>
</html>
