    <style>
/* ============================================ */
/* 🎨 PALETA RANCHERA PREMIUM + FONDO MADERA    */
/* ============================================ */
:root {
    --fondo: #1a1410;
    --tarjeta: #2d1f15;
    --tarjeta-hover: #3a2819;
    --dorado: #d4a843;
    --dorado-claro: #e8c170;
    --terracota: #a0522d;
    --crema: #f5e6d3;
    --crema-suave: #d4c4a8;
    --azul-tf: #4a6fa5;
    --verde-wa: #25d366;
    --verde-wa-hover: #1da851;
    --borde: rgba(212, 168, 67, 0.2);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--crema);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

/* ============================================ */
/* 🪵 EFECTO MADERA CON BETAS (CSS PURO)        */
/* ============================================ */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -1;
    
    /* CAPA 1: Base marrón cálida */
    background: 
        linear-gradient(135deg, 
            #2a1d13 0%, 
            #1a1410 25%, 
            #241812 50%, 
            #1a1410 75%, 
            #2a1d13 100%);
}

body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -1;
    
    /* CAPA 2: Vetitas de madera (rayas sutiles) */
    background:
        /* Vetitas finas en ángulo 88° */
        repeating-linear-gradient(
            88deg,
            transparent 0px,
            transparent 18px,
            rgba(90, 60, 30, 0.15) 18px,
            rgba(90, 60, 30, 0.15) 19px,
            transparent 19px,
            transparent 42px
        ),
        /* Vetitas más gruesas en ángulo 92° */
        repeating-linear-gradient(
            92deg,
            transparent 0px,
            transparent 35px,
            rgba(60, 40, 20, 0.2) 35px,
            rgba(60, 40, 20, 0.2) 37px,
            transparent 37px,
            transparent 80px
        ),
        /* Vetitas muy sutiles en ángulo 87° */
        repeating-linear-gradient(
            87deg,
            transparent 0px,
            transparent 60px,
            rgba(120, 80, 40, 0.08) 60px,
            rgba(120, 80, 40, 0.08) 62px,
            transparent 62px,
            transparent 120px
        ),
        /* CAPA 3: Grano jaspeado (nudos de madera) */
        radial-gradient(ellipse 120px 80px at 20% 30%, rgba(40, 25, 15, 0.4) 0%, transparent 70%),
        radial-gradient(ellipse 150px 100px at 75% 65%, rgba(40, 25, 15, 0.35) 0%, transparent 70%),
        radial-gradient(ellipse 100px 70px at 50% 85%, rgba(50, 30, 18, 0.3) 0%, transparent 70%),
        radial-gradient(ellipse 80px 60px at 85% 15%, rgba(50, 30, 18, 0.25) 0%, transparent 70%),
        /* CAPA 4: Brillo sutil tipo madera pulida */
        radial-gradient(ellipse at 30% 20%, rgba(212, 168, 67, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(212, 168, 67, 0.03) 0%, transparent 50%);
}
</head>
